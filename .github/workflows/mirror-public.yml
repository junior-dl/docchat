# Mirrors main to the public repo. Work happens in the private repo only.
name: Mirror main to public
on:
  push:
    branches: [main]
jobs:
  mirror:
    if: github.repository == 'junior-dl/docchat-private'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to public mirror
        env:
          TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
        run: git push --force "https://x-access-token:${TOKEN}@github.com/junior-dl/docchat.git" HEAD:main
